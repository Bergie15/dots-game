<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f3f6fd">
  <title>Bubble Breaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Bubble Breaker</h1>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <div class="segmented" role="tablist" aria-label="Game mode">
      <button class="seg" id="classicBtn" role="tab">Classic</button>
      <button class="seg" id="levelsBtn" role="tab">Levels</button>
    </div>

    <section class="stats" id="stats">
      <div class="stat">
        <span class="label" id="scoreLabel">Score</span>
        <span class="value" id="score">0</span>
        <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
        <span class="goal" id="goal"></span>
      </div>
      <div class="stat levels-only">
        <span class="label">Board</span>
        <span class="value" id="total">0</span>
      </div>
      <div class="stat">
        <span class="label">Best</span>
        <span class="value" id="best">0</span>
      </div>
    </section>

    <div class="info" id="info">Tap a group of 2+ matching bubbles</div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="overlay hidden" id="overlay">
        <div class="panel">
          <h2 id="overTitle">Game Over</h2>
          <p id="overText"></p>
          <div class="panel-actions">
            <button class="btn" id="altBtn">Undo</button>
            <button class="btn primary" id="againBtn">Play again</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="newBtn">New game</button>
      <button class="btn primary" id="undoBtn">Undo</button>
    </div>
  </main>

  <div class="modal hidden" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="close" id="closeSettings" aria-label="Close">&times;</button>
      </div>

      <h3>Bubble size</h3>
      <div class="options" id="sizeOptions">
        <button class="option" data-size="small"><span class="dot" style="--d:10px"></span>Small</button>
        <button class="option" data-size="medium"><span class="dot" style="--d:14px"></span>Medium</button>
        <button class="option" data-size="large"><span class="dot" style="--d:18px"></span>Large</button>
        <button class="option" data-size="xl"><span class="dot" style="--d:22px"></span>Extra large</button>
      </div>
      <p class="hint">Bigger bubbles means fewer on the board. Each mode remembers its own size. Changing size starts a new board.</p>

      <h3>Popping</h3>
      <div class="segmented" id="tapOptions">
        <button class="seg" data-tap="1">Tap once</button>
        <button class="seg" data-tap="2">Tap twice</button>
      </div>
      <p class="hint">Tap twice shows the points before popping.</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
