<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f3f6fd">
  <title>Bubble Breaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Bubble Breaker</h1>
      <button class="pill" id="modeBtn" title="Toggle tap mode">2-tap</button>
    </header>

    <section class="stats">
      <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="label">Best</span>
        <span class="value" id="best">0</span>
      </div>
    </section>

    <div class="info" id="info">Tap a group of 2+ matching bubbles</div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="overlay hidden" id="overlay">
        <div class="panel">
          <h2 id="overTitle">Game Over</h2>
          <p id="overText"></p>
          <button class="btn primary" id="againBtn">Play again</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="newBtn">New game</button>
      <button class="btn primary" id="undoBtn">Undo</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
